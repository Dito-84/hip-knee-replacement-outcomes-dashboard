name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that no real data is committed
        run: python3 scripts/check_no_real_data.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -v

      - name: Build the dashboard from synthetic data
        run: python build.py

  infra:
    # AWS hosting (infra/): template security checks, data-check Lambda tests, and a full CDK synth.
    # Needs no AWS account: nothing is deployed here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            infra/requirements.txt
            infra/lambda/data_check/requirements.txt

      - name: Install
        run: pip install -r requirements.txt -r infra/requirements.txt pytest

      - name: Infrastructure and Lambda tests
        run: pytest -v infra/tests --bundle

      - name: CDK synth (fails on any unexplained cdk-nag security finding)
        working-directory: infra
        run: npx --yes aws-cdk@2 synth --quiet
