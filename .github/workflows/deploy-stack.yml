name: Deploy stack

# Deploys the main AWS stack (HipKneeDashboard) after a merge to main that
# changes it, or the code its Lambdas bundle. Nothing changes in AWS until a
# required reviewer approves the `production` environment.
#
#   plan    no approval needed. Template diff with the read-only Diff role, written
#           to the job summary for the reviewer; warns if the CI stack itself
#           changed (that one is deployed by hand).
#   deploy  waits in `production`. Creates a change set with CDK's deploy role,
#           refuses it if a stateful resource would be replaced or removed
#           (scripts/check_change_set.py), executes it, waits, then runs the
#           end-to-end smoke test with the Smoke role.
#
# The repository is public, so logs and summaries are too: the account ID and
# the alert email (a secret) are masked and scrubbed. Skips itself until the
# AWS_STACK_DEPLOY_ROLE_ARN variable is set.

on:
  push:
    branches: [main]
    paths:
      - "infra/app.py"
      - "infra/cdk.json"
      - "infra/requirements.txt"
      - "infra/dashboard_infra/**"
      - "infra/lambda/**"
      - "outcomes/*.py"
      - "scripts/check_change_set.py"
      - "scripts/smoke_upload.py"
      - ".github/workflows/deploy-stack.yml"
  workflow_dispatch:
    inputs:
      allow_replacement:
        description: "Allow replacing or removing a stateful resource (only for a deliberate replacement)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # the OIDC tokens AWS checks for the Diff, Deploy and Smoke roles

# Its own group: a run waiting for approval mustn't hold up (or, with a second merge,
# cancel) the website deploy. The two change different things: the site bucket vs the stack.
concurrency:
  group: aws-stack-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # -eo pipefail, so a failing command before `| tee` still fails the step

env:
  STACK: HipKneeDashboard
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  plan:
    if: vars.AWS_STACK_DEPLOY_ROLE_ARN != '' && vars.AWS_DIFF_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            infra/requirements.txt
            infra/lambda/data_check/requirements.txt
            infra/lambda/data_check/requirements-nodeps.txt
      - run: pip install -r infra/requirements.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Diff (template comparison, read-only)
        working-directory: infra
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account"
          npx --yes aws-cdk@2 diff "$STACK" --method=template --no-color -c alert_email="$ALERT_EMAIL" \
            > ../diff.txt 2>&1 || echo "cdk diff exited $?" >> ../diff.txt
          python3 ../scripts/scrub_diff.py ../diff.txt "$account" "$ALERT_EMAIL"
          {
            echo "## What this deploy would change"
            echo "Approve the \`production\` environment to deploy. After approval, the replacement guard"
            echo "checks the change set itself and refuses to replace or remove stateful resources."
            echo '```'
            cat ../diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The CI stack is deployed by hand; say so if this merge changed it
          if ! npx --yes aws-cdk@2 diff HipKneeDashboardCi --method=template --fail > /dev/null 2>&1; then
            echo "::warning title=CI stack changed::HipKneeDashboardCi differs from what's deployed. Deploy it from your machine: npx aws-cdk@2 deploy HipKneeDashboardCi"
          fi

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    environment: production   # waits for a required reviewer; only main may deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            infra/requirements.txt
            infra/lambda/data_check/requirements.txt
            infra/lambda/data_check/requirements-nodeps.txt
      # infra/requirements.txt for CDK; the root requirements (pandas) for the smoke test's samples;
      # boto3 for the replacement guard and the smoke test (the Lambdas get it from their runtime)
      - run: pip install -r infra/requirements.txt -r requirements.txt boto3

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STACK_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create the change set (nothing changes yet)
        working-directory: infra
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
          # Unique per run and attempt: a manual run from the same commit gets its own change set
          name="ci-${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CHANGE_SET=$name" >> "$GITHUB_ENV"
          npx --yes aws-cdk@2 deploy "$STACK" --method=prepare-change-set \
            --change-set-name "$name" \
            --require-approval never -c alert_email="$ALERT_EMAIL"

      - name: Replacement guard
        id: guard
        env:
          ALLOW: ${{ inputs.allow_replacement && '--allow-replacement' || '' }}
        run: |
          set +e
          python3 scripts/check_change_set.py --stack "$STACK" --change-set "$CHANGE_SET" $ALLOW | tee guard.txt
          code=${PIPESTATUS[0]}
          { echo "## Change set $CHANGE_SET"; cat guard.txt; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = 3 ]; then
            # CloudFormation keeps an empty change set as FAILED; remove it
            aws cloudformation delete-change-set --stack-name "$STACK" --change-set-name "$CHANGE_SET" 2>/dev/null || true
            echo "Nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "changes=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$code" != 0 ]; then
            aws cloudformation delete-change-set --stack-name "$STACK" --change-set-name "$CHANGE_SET" || true
            exit "$code"
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Execute the change set
        if: steps.guard.outputs.changes == 'true'
        run: |
          aws cloudformation execute-change-set --stack-name "$STACK" --change-set-name "$CHANGE_SET"
          aws cloudformation wait stack-update-complete --stack-name "$STACK"
          echo "Deployed change set $CHANGE_SET." >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SMOKE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Smoke test (throwaway accounts, synthetic samples only)
        run: |
          echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
          python3 scripts/smoke_upload.py | tee smoke.txt
          { echo "## Smoke test"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
