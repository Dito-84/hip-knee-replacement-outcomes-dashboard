name: Deploy to AWS

# Builds the dashboard from the synthetic dataset and publishes it to the S3 +
# CloudFront site defined in infra/. GitHub signs in to AWS through OIDC, so no
# AWS keys are stored here.
#
# Skips itself until the repository variable AWS_DEPLOY_ROLE_ARN is set
# (see infra/README.md), so it does nothing before the AWS stack exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets the job request the OIDC token AWS checks

concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python3 scripts/check_no_real_data.py

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build (with the upload page, once the UPLOAD_* variables are set)
        run: python build.py --out _site
        env:
          # Identifiers from the cdk deploy outputs, not secrets; build.py checks their shape
          UPLOAD_API_URL: ${{ vars.UPLOAD_API_URL }}
          UPLOAD_AUTH_DOMAIN: ${{ vars.UPLOAD_AUTH_DOMAIN }}
          UPLOAD_CLIENT_ID: ${{ vars.UPLOAD_CLIENT_ID }}
          UPLOAD_BUCKET: ${{ vars.UPLOAD_BUCKET }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Upload the site
        run: aws s3 sync _site "s3://${{ vars.AWS_SITE_BUCKET }}" --delete --no-progress

      - name: Clear the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" --paths "/*" \
            --query 'Invalidation.Id' --output text
