name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that no real data is committed
        run: python3 scripts/check_no_real_data.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -v

      - name: Build the dashboard from synthetic data
        run: python build.py
